<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>myTiffin</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#f5eee0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  img{width:56px;height:56px;border-radius:16px;animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.55;}50%{opacity:1;}}
</style>
</head>
<body>
<img src="/icon-192.png" alt="">
<script>
  // GitHub Pages serves this file (HTTP 404) for any path with no matching
  // file — the only such paths in this app are clean URLs: a customer
  // vendor link (mytiffin.cloud/hungryb) or an admin link
  // (mytiffin.cloud/admin/hungryb). There's no server here to rewrite
  // either into the query params the app already resolves (?v=/?admin=),
  // so we do it client-side: redirect to index.html carrying the slug as
  // that param, tagged __pathmode so shared.js's normalizePathModeUrl()
  // can swap the address bar back to this same clean path once it's
  // resolved (see shared.js).
  var parts = location.pathname.replace(/^\/+/, '').split('/').filter(Boolean);
  var rest = location.search ? location.search.slice(1) : '';
  var qs = null;
  if (parts[0] === 'admin' && parts[1]) {
    qs = 'admin=' + encodeURIComponent(parts[1]) + (rest ? '&' + rest : '') + '&__pathmode=1';
  } else if (parts[0]) {
    qs = 'v=' + encodeURIComponent(parts[0]) + (rest ? '&' + rest : '') + '&__pathmode=1';
  }
  if (qs) location.replace('/?' + qs + location.hash);
  else location.replace('/');
</script>
</body>
</html>
