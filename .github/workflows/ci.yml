name: CI

# Kab chalta hai:
#  - har pull request par (merge se pehle red/green dikh jaye)
#  - main par push hone ke baad (agar koi seedha file edit kare)
#  - "Run workflow" button se — GitHub mobile app se bhi dabaya ja sakta hai
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Ek hi branch par naya push aaye to purana run cancel — CI minutes bachte hain
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Tez check: seconds me fail hota hai, poora suite chalane se pehle ──
  # Phone se file edit karne par jo cheezein sabse pehle tootti hain wahi
  # yahan pakdi jaati hain: stale build stamp aur inline <script> ka typo.
  # Test jobs ka matrix bhi yahi banata hai (neeche outputs dekho).
  guard:
    name: Build stamp + syntax
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install

      # Stamp stale hone ka matlab: naya HTML + purana cached JS users tak
      # pahunchega (GitHub Pages 10 min cache karta hai). Isliye ye blocking hai.
      - name: Build stamp up to date hai?
        run: |
          node tools/stamp-version.js --check || {
            echo ""
            echo "::error::Build stamp stale hai. Local par 'npm run stamp' chala kar commit karo."
            exit 1
          }

      - name: JS syntax (inline <script> + shared.js)
        run: node tools/check-syntax.js

      # Har spec file kisi ek group me honi chahiye. Iske bina naya test file
      # chupchaap kabhi chalta hi nahi aur CI jhoothi green dikhati rehti.
      - name: Har test file kisi group me hai?
        run: node tools/check-test-groups.js

      - name: Test groups -> matrix
        id: groups
        run: |
          echo "matrix=$(node -e "
            const g = require('./tests/groups.json').groups;
            process.stdout.write(JSON.stringify(g.map(x => ({
              name: x.name, files: x.files.join(' ')
            }))));
          ")" >> "$GITHUB_OUTPUT"

  # ── Poora Playwright suite, purpose ke hisaab se baante hue ──
  # Pehle --shard=i/6 tha, jo files ko alphabetically kaat deta hai — "shard 4
  # fail hua" se ye pata hi nahi chalta tha ke app ka kya toota. Ab job ka naam
  # hi bata deta hai. Kaunsi file kis group me hai: tests/groups.json.
  #
  # Config jaan-boojh kar workers:1 / fullyParallel:false par hai (screenshots
  # aur console-error checks serial chahiye), isliye groups parallel machines
  # par chalte hain, har group apne andar serial.
  test:
    name: ${{ matrix.name }}
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false # ek group fail ho to baaki bhi poore chalne do
      matrix:
        include: ${{ fromJSON(needs.guard.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test ${{ matrix.files }}

      # Fail hone par screenshot + trace mil jaata hai — phone se bhi
      # download karke dekh sakte ho ke exactly kya toota.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Group naam me spaces/& hote hain, artifact name me nahi chalte
          name: artifacts-${{ strategy.job-index }}
          path: tests/artifacts/
          retention-days: 7
          if-no-files-found: ignore
