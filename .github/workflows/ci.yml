name: CI

# Kab chalta hai:
#  - har pull request par (merge se pehle red/green dikh jaye)
#  - main par push hone ke baad (agar koi seedha file edit kare)
#  - "Run workflow" button se — GitHub mobile app se bhi dabaya ja sakta hai
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Ek hi branch par naya push aaye to purana run cancel — CI minutes bachte hain
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Tez check: seconds me fail hota hai, poora suite chalane se pehle ──
  # Phone se file edit karne par jo do cheezein sabse pehle tootti hain wahi
  # yahan pakdi jaati hain: stale build stamp aur inline <script> ka typo.
  guard:
    name: Build stamp + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install

      # Stamp stale hone ka matlab: naya HTML + purana cached JS users tak
      # pahunchega (GitHub Pages 10 min cache karta hai). Isliye ye blocking hai.
      - name: Build stamp up to date hai?
        run: |
          node tools/stamp-version.js --check || {
            echo ""
            echo "::error::Build stamp stale hai. Local par 'npm run stamp' chala kar commit karo."
            exit 1
          }

      - name: JS syntax (inline <script> + shared.js)
        run: node tools/check-syntax.js

  # ── Poora Playwright suite ──
  # 209 tests hain aur config workers:1 / fullyParallel:false par set hai
  # (jaan-boojh kar — screenshots aur console-error checks serial chahiye).
  # Isliye ek machine par ~1.5 ghanta lagta. 6 shards me baant diya: har shard
  # apne andar serial hi chalta hai, bas machines parallel hain.
  test:
    name: Tests (shard ${{ matrix.shard }}/6)
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false # ek shard fail ho to baaki bhi poore chalne do
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test --shard=${{ matrix.shard }}/6

      # Fail hone par screenshot + trace mil jaata hai — phone se bhi
      # download karke dekh sakte ho ke exactly kya toota.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-shard-${{ matrix.shard }}
          path: tests/artifacts/
          retention-days: 7
          if-no-files-found: ignore
